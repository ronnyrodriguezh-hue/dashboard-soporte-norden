<html lang="es">

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Soporte — Norden Brokers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;}
header{background:linear-gradient(135deg,#1e3a5f 0%,#1a5276 55%,#2980b9 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;}
.divider-v{width:1px;height:44px;background:rgba(255,255,255,.3);}
.header-text h1{font-size:1.1rem;font-weight:700;}
.header-text p{font-size:.74rem;opacity:.72;margin-top:3px;}
.badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 14px;font-size:.75rem;margin-left:auto;white-space:nowrap;font-weight:600;}
nav{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto;}
nav button{padding:12px 16px;border:none;background:none;cursor:pointer;font-size:.82rem;font-weight:600;color:#64748b;border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;}
nav button.active{color:#1a5276;border-bottom-color:#4BBFEA;}
nav button:hover:not(.active){color:#1e293b;}
.tab{display:none;padding:20px;max-width:1400px;margin:0 auto;}
.tab.active{display:block;}
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.kpi{background:#fff;border-radius:12px;padding:14px 18px;flex:1;min-width:130px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #1a5276;}
.kpi.green{border-color:#22c55e;}.kpi.sky{border-color:#4BBFEA;}.kpi.orange{border-color:#f59e0b;}.kpi.purple{border-color:#8b5cf6;}
.kpi-val{font-size:1.75rem;font-weight:800;line-height:1;}
.kpi-lbl{font-size:.69rem;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card h3{font-size:.78rem;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;font-weight:700;}
.svg-chart{width:100%;overflow:visible;}
.xtable-wrap{overflow-x:auto;}
table.xt{border-collapse:collapse;width:100%;font-size:.75rem;}
table.xt th,table.xt td{border:1px solid #e2e8f0;padding:6px 8px;text-align:center;}
table.xt th{background:#1e3a5f;color:#fff;white-space:nowrap;font-weight:600;}
table.xt tr:nth-child(even) td{background:#f8fafc;}
table.xt td.lbl{background:#f1f5f9;font-weight:600;text-align:left;color:#334155;white-space:nowrap;}
table.xt td.total{background:#dbeafe;font-weight:700;}
table.xt th.total{background:#1e40af;}
.upload-zone{border:2px dashed #94a3b8;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:.2s;margin-top:16px;}
.upload-zone:hover{border-color:#4BBFEA;background:#f0f9ff;}
.upload-zone p{color:#64748b;font-size:.82rem;margin-top:6px;}
#moverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto;}
#moverlay.open{display:flex;}
#mbox{background:#fff;border-radius:16px;width:100%;max-width:920px;padding:24px;position:relative;max-height:85vh;overflow-y:auto;}
#mbox h2{font-size:.95rem;font-weight:700;margin-bottom:3px;}
#mbox .msub{font-size:.75rem;color:#64748b;margin-bottom:14px;}
#mbox table{width:100%;border-collapse:collapse;font-size:.76rem;}
#mbox table th{background:#1e3a5f;color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;}
#mbox table td{padding:6px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top;}
#mbox table tr:nth-child(even) td{background:#f8fafc;}
.close-btn{position:absolute;top:12px;right:14px;border:none;background:none;font-size:1.5rem;cursor:pointer;color:#64748b;line-height:1;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:600;}
.hrs-config{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hrs-config label{font-size:.83rem;font-weight:600;}
.hrs-config input[type=number]{border:1.5px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:.88rem;width:110px;}
.hrs-bar{background:#e2e8f0;border-radius:20px;height:16px;overflow:hidden;margin:10px 0;}
.hrs-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#22c55e,#4BBFEA);transition:width .4s;}
.hrs-stats{display:flex;gap:20px;font-size:.8rem;flex-wrap:wrap;margin-top:4px;}
.hrs-stats span b{font-size:1rem;}
table.jira-tbl{width:100%;border-collapse:collapse;font-size:.76rem;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
table.jira-tbl th{background:#1e3a5f;color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;}
table.jira-tbl td{padding:7px 10px;border-bottom:1px solid #e2e8f0;vertical-align:middle;}
table.jira-tbl tr:nth-child(even) td{background:#f8fafc;}
table.jira-tbl input[type=number]{width:66px;border:1px solid #cbd5e1;border-radius:6px;padding:3px 6px;font-size:.76rem;}
table.jira-tbl input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.search-box{display:flex;gap:10px;margin-bottom:16px;}
.search-box input{flex:1;border:1.5px solid #cbd5e1;border-radius:10px;padding:9px 14px;font-size:.88rem;outline:none;}
.search-box input:focus{border-color:#4BBFEA;}
.search-box button{background:#1a5276;color:#fff;border:none;border-radius:10px;padding:9px 22px;cursor:pointer;font-weight:600;font-size:.84rem;}
.search-box button:hover{background:#4BBFEA;}
.result-card{background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.rc-key{font-size:.82rem;font-weight:800;color:#1a5276;}
.rc-res{font-size:.82rem;margin:4px 0;}
.rc-meta{font-size:.71rem;color:#64748b;}
mark{background:#fef08a;border-radius:3px;padding:0 2px;}
.btn{border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:.82rem;margin-right:8px;}
.btn-green{background:#22c55e;color:#fff;}.btn-blue{background:#1a5276;color:#fff;}
.btn-green:hover{background:#16a34a;}.btn-blue:hover{background:#4BBFEA;}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-row input,.filter-row select{border:1.5px solid #cbd5e1;border-radius:8px;padding:7px 10px;font-size:.8rem;}
@media(max-width:680px){.charts-row{grid-template-columns:1fr;}.kpi-row{gap:8px;}}
</style>
</head>

<header>
  <div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 62" width="170" height="56" aria-label="Norden Brokers"><polygon points="22,24 32,11 42,24 39,24 32,16 25,24" fill="#4BBFEA"/><text x="52" y="27" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="19" fill="#ffffff" letter-spacing="-0.5">Norden</text><text x="52" y="46" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="19" fill="#ffffff" letter-spacing="-0.5">Brokers</text><text x="52" y="58" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="7.5" fill="rgba(255,255,255,0.72)" letter-spacing="0.1em">ASESORES EN SEGUROS</text></svg></div>

  <div class="header-text">

  </div>
  <span class="badge" id="totalBadge">507 tickets</span>
</header>
<nav>
  <button class="active" onclick="showTab('resumen',this)">📊 Resumen General</button>
  <button onclick="showTab('horas',this)">⏱ Gestión de Horas</button>
  <button onclick="showTab('planif',this)">📋 Planificador Jiras</button>
  <button onclick="showTab('buscar',this)">🔍 Consultar Ticket</button>
</nav>
<div id="tab-resumen" class="tab active">
  <div class="kpi-row" id="kpiRow"></div>
  <div class="charts-row">
    <div class="card"><h3>Por Tipo de Incidencia</h3><div id="chartTipo"></div></div>
    <div class="card"><h3>Por Estado</h3><div id="chartEstado"></div></div>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <h3>Tabla Cruzada: Tipo × Estado</h3>
    <div class="xtable-wrap" id="xtableWrap"></div>
  </div>
  <div class="upload-zone" onclick="document.getElementById('fileIn').click()" id="dropZone">
    <div style="font-size:2rem;">📁</div>
    <b>Actualizar datos</b>
    <p>Clic o arrastrá un archivo CSV exportado de Jira</p>
    <input type="file" id="fileIn" accept=".csv" style="display:none" onchange="loadFile(this.files[0])">
  </div>
</div>
<div id="tab-horas" class="tab">
  <div class="hrs-config">
    <label>⏱ Horas acordadas:</label>
    <input type="number" id="hsAcord" value="200" min="1" oninput="updateHrsBar()">
    <span style="font-size:.78rem;color:#64748b;">Mínimo 10hs por Jira por defecto</span>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <h3>Progreso de Horas</h3>
    <div class="hrs-bar"><div class="hrs-fill" id="hrsFill" style="width:0%"></div></div>
    <div class="hrs-stats" id="hrsStats"></div>
  </div>
  <div style="margin-bottom:14px;">
    <button class="btn btn-green" onclick="exportCSV()">⬇ Exportar CSV</button>
    <button class="btn btn-blue" onclick="saveLocalState()">💾 Guardar estado</button>
  </div>
  <div class="kpi-row" id="kpiHrs"></div>
</div>
<div id="tab-planif" class="tab">
  <div class="filter-row">
    <input id="filtroTipo" placeholder="Filtrar tipo..." style="width:160px;" oninput="renderPlanif()">
    <input id="filtroEstado" placeholder="Filtrar estado..." style="width:180px;" oninput="renderPlanif()">
    <select id="filtroOk" onchange="renderPlanif()">
      <option value="">Todos</option><option value="ok">Solo OK ✅</option><option value="nook">Sin OK</option>
    </select>
  </div>
  <div id="planifWrap"></div>
</div>
<div id="tab-buscar" class="tab">
  <div class="search-box">
    <input id="searchQ" type="text" placeholder="Número de Jira (ej: NS-1826) o palabra clave..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Buscar</button>
  </div>
  <div id="searchResults"></div>
</div>
<div id="moverlay" onclick="if(event.target===this)closeMod()">
  <div id="mbox">
    <button class="close-btn" onclick="closeMod()">×</button>
    <h2 id="mtitle"></h2>
    <div class="msub" id="msub"></div>
    <div id="mbody"></div>
  </div>
</div>

function makePie(el, data) {
  const tot = data.reduce((s,d)=>s+d.v,0);
  const cx=140,cy=120,r=95;
  let paths='',leg='',angle=0;
  data.forEach((d,i)=>{
    const pct=d.v/tot, a1=angle, a2=angle+pct*2*Math.PI;
    const x1=cx+r*Math.sin(a1),y1=cy-r*Math.cos(a1);
    const x2=cx+r*Math.sin(a2),y2=cy-r*Math.cos(a2);
    const lg=pct>0.5?1:0;
    const mx=(a1+a2)/2;
    const lx=cx+(r+24)*Math.sin(mx),ly=cy-(r+24)*Math.cos(mx);
    const esc=JSON.stringify(d.l);
    const escAttr=d.l.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r},0,${lg},1,${x2},${y2}Z" fill="${d.c}" stroke="#fff" stroke-width="2.5" style="cursor:pointer;opacity:.91" data-type="tipo" data-val="${escAttr}"><title>${d.l}: ${d.v} (${Math.round(pct*100)}%)</title></path>`;
    if(pct>0.06) paths+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" font-family="Segoe UI,sans-serif" fill="#fff" font-weight="700" pointer-events="none">${Math.round(pct*100)}%</text>`;
    leg+=`<g transform="translate(0,${i*24})" style="cursor:pointer" data-type="tipo" data-val="${escAttr}"><rect x="0" y="3" width="13" height="13" rx="3" fill="${d.c}"/><text x="20" y="14" font-size="11" font-family="Segoe UI,sans-serif" fill="#334155">${d.l} (${d.v})</text></g>`;
    angle=a2;
  });
  paths+=`<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="14" font-family="Segoe UI,sans-serif" fill="#1e293b" font-weight="800">${tot}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" font-family="Segoe UI,sans-serif" fill="#64748b">total</text>`;
  const lH=data.length*24+10;
  el.innerHTML=`<svg class="svg-chart" viewBox="0 0 340 ${Math.max(260,lH+10)}" style="max-height:280px">${paths}<g transform="translate(${cx*2+10},${cy-data.length*12})">${leg}</g></svg>`;
  el.querySelectorAll('[data-val]').forEach(node=>{
    node.addEventListener('click',()=>openModal(node.dataset.type,node.dataset.val));
  });
}

function makeBar(el, labels, vals, colors) {
  const W=500,H=220,pL=28,pB=36,pT=10,pR=8;
  const cW=W-pL-pR, cH=H-pB-pT;
  const maxV=Math.max(...vals,1);
  const bW=Math.min(42,cW/labels.length*0.68);
  const gap=cW/labels.length;
  let bars='',axes='';
  for(let i=0;i<=4;i++){
    const y=pT+cH*(1-i/4);
    axes+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    axes+=`<text x="${pL-4}" y="${y+4}" font-size="9" fill="#94a3b8" text-anchor="end">${Math.round(maxV*i/4)}</text>`;
  }
  labels.forEach((lbl,i)=>{
    const bH=vals[i]/maxV*cH;
    const x=pL+gap*(i+0.5)-bW/2;
    const y=pT+cH-bH;
    const sl=lbl.length>13?lbl.substring(0,12)+'…':lbl;
    const esc=JSON.stringify(lbl);
    const escAttr=lbl.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    bars+=`<rect x="${x}" y="${y}" width="${bW}" height="${bH}" rx="4" fill="${colors[i%colors.length]}" style="cursor:pointer;opacity:.88" data-type="estado" data-val="${escAttr}"><title>${lbl}: ${vals[i]}</title></rect>`;
    bars+=`<text x="${x+bW/2}" y="${y-4}" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">${vals[i]}</text>`;
    bars+=`<text x="${x+bW/2}" y="${H-pB+14}" font-size="8" fill="#64748b" text-anchor="middle" transform="rotate(-30,${x+bW/2},${H-pB+14})">${sl}</text>`;
  });
  el.innerHTML=`<svg class="svg-chart" viewBox="0 0 ${W} ${H}" style="max-height:240px">${axes}${bars}<line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT+cH}" stroke="#cbd5e1" stroke-width="1.5"/><line x1="${pL}" y1="${pT+cH}" x2="${W-pR}" y2="${pT+cH}" stroke="#cbd5e1" stroke-width="1.5"/></svg>`;
  el.querySelectorAll('[data-val]').forEach(node=>{
    node.addEventListener('click',()=>openModal(node.dataset.type,node.dataset.val));
  });
}

function buildResumen(){
  const tipos=[...new Set(tickets.map(t=>t.tipo))].sort();
  const estados=[...new Set(tickets.map(t=>t.estado))].sort();
  const total=tickets.length;
  const fin=tickets.filter(t=>t.estado==='Finalizada').length;
  const cur=tickets.filter(t=>t.estado==='Trabajo en curso').length;
  const pD=tickets.filter(t=>t.estado==='Pendiente - Desarrollo').length;
  const rec=tickets.filter(t=>t.estado==='Rechazado').length;
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi"><div class="kpi-val">${total}</div><div class="kpi-lbl">Total Tickets</div></div>
    <div class="kpi green"><div class="kpi-val">${fin}</div><div class="kpi-lbl">Finalizadas</div></div>
    <div class="kpi sky"><div class="kpi-val">${cur}</div><div class="kpi-lbl">En Curso</div></div>
    <div class="kpi orange"><div class="kpi-val">${pD}</div><div class="kpi-lbl">Pend. Desarrollo</div></div>
    <div class="kpi purple"><div class="kpi-val">${rec}</div><div class="kpi-lbl">Rechazados</div></div>
  `;
  document.getElementById('totalBadge').textContent=total+' tickets';
  makePie(document.getElementById('chartTipo'), tipos.map((tp,i)=>({l:tp,v:tickets.filter(t=>t.tipo===tp).length,c:PAL[i]})));
  makeBar(document.getElementById('chartEstado'), estados, estados.map(e=>tickets.filter(t=>t.estado===e).length), PAL);
  let th=`<table class="xt"><thead><tr><th>Tipo</th>`;
  estados.forEach(e=>th+=`<th>${e}</th>`);
  th+=`<th class="total">TOTAL</th></tr></thead><tbody>`;
  let tot=new Array(estados.length).fill(0);
  tipos.forEach(tp=>{
    th+=`<tr><td class="lbl">${tp}</td>`;
    let rT=0;
    estados.forEach((e,ei)=>{
      const n=tickets.filter(t=>t.tipo===tp&&t.estado===e).length;
      tot[ei]+=n;rT+=n;
      th+=`<td onclick="openModal2('${tp.replace(/'/g,"\'")}','${e.replace(/'/g,"\'")}') " style="cursor:pointer${n?';font-weight:600':''}">${n||''}</td>`;
    });
    th+=`<td class="total">${rT}</td></tr>`;
  });
  th+=`<tr><td class="lbl">TOTAL</td>`;
  tot.forEach(n=>th+=`<td class="total">${n}</td>`);
  th+=`<td class="total">${total}</td></tr></tbody></table>`;
  document.getElementById('xtableWrap').innerHTML=th;
}

function openModal(type,val){
  const filt=type==='tipo'?tickets.filter(t=>t.tipo===val):tickets.filter(t=>t.estado===val);
  showModal(filt,val);
}
function openModal2(tp,es){
  const filt=tickets.filter(t=>t.tipo===tp&&t.estado===es);
  if(filt.length) showModal(filt,tp+' — '+es);
}
function showModal(filt,title){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('msub').textContent=filt.length+' tickets';
  let rows='';
  filt.forEach(t=>{rows+=`<tr><td><b style="color:#1a5276">${t.clave}</b></td><td>${t.resumen}</td><td>${t.informador}</td><td>${t.prioridad}</td><td><span class="pill" style="${pillStyle(t.estado)}">${t.estado}</span></td><td style="font-size:.7rem;color:#64748b">${t.actualizada}</td></tr>`;});
  document.getElementById('mbody').innerHTML=`<table><thead><tr><th>Clave</th><th>Resumen</th><th>Informador</th><th>Prioridad</th><th>Estado</th><th>Actualizada</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('moverlay').classList.add('open');
}
function closeMod(){document.getElementById('moverlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod();});

function updateHrsBar(){
  const ac=parseFloat(document.getElementById('hsAcord').value)||200;
  const tot=tickets.reduce((s,t)=>s+t.horas_min,0);
  const asig=tickets.reduce((s,t)=>s+t.horas_asignadas,0);
  const pct=Math.min(100,Math.round(tot/ac*100));
  document.getElementById('hrsFill').style.width=pct+'%';
  document.getElementById('hrsStats').innerHTML=`<span>⏱ Acordadas: <b>${ac}hs</b></span><span>📋 Estimadas: <b>${tot}hs</b></span><span>✅ Asignadas: <b>${asig}hs</b></span><span>📊 Uso: <b>${pct}%</b></span>`;
  const ok=tickets.filter(t=>t.ok).length;
  document.getElementById('kpiHrs').innerHTML=`
    <div class="kpi sky"><div class="kpi-val">${tickets.length}</div><div class="kpi-lbl">Total Jiras</div></div>
    <div class="kpi green"><div class="kpi-val">${ok}</div><div class="kpi-lbl">Aprobados ✅</div></div>
    <div class="kpi orange"><div class="kpi-val">${tickets.length-ok}</div><div class="kpi-lbl">Sin Aprobar</div></div>
    <div class="kpi"><div class="kpi-val">${ac}</div><div class="kpi-lbl">Hs Acordadas</div></div>
  `;
}

function renderPlanif(){
  const ft=(document.getElementById('filtroTipo').value||'').toLowerCase();
  const fe=(document.getElementById('filtroEstado').value||'').toLowerCase();
  const fo=document.getElementById('filtroOk').value;
  const filt=tickets.filter(t=>(!ft||t.tipo.toLowerCase().includes(ft))&&(!fe||t.estado.toLowerCase().includes(fe))&&(fo===''||(fo==='ok'&&t.ok)||(fo==='nook'&&!t.ok)));
  let html=`<table class="jira-tbl"><thead><tr><th>Clave</th><th>Tipo</th><th>Resumen</th><th>Estado</th><th>Informador</th><th>Hs Mín</th><th>Hs Asig</th><th>OK</th></tr></thead><tbody>`;
  filt.forEach(t=>{
    const idx=tickets.indexOf(t);
    html+=`<tr><td><b style="color:#1a5276">${t.clave}</b></td><td style="font-size:.72rem;white-space:nowrap">${t.tipo}</td><td style="max-width:280px">${t.resumen}</td><td><span class="pill" style="${pillStyle(t.estado)}">${t.estado}</span></td><td>${t.informador}</td><td><input type="number" value="${t.horas_min}" min="1" onchange="tickets[${idx}].horas_min=+this.value;updateHrsBar()"></td><td><input type="number" value="${t.horas_asignadas}" min="0" onchange="tickets[${idx}].horas_asignadas=+this.value;updateHrsBar()"></td><td style="text-align:center"><input type="checkbox" ${t.ok?'checked':''} onchange="tickets[${idx}].ok=this.checked;updateHrsBar()"></td></tr>`;
  });
  html+=`</tbody></table><p style="font-size:.75rem;color:#64748b;margin-top:8px">Mostrando ${filt.length} de ${tickets.length} tickets</p>`;
  document.getElementById('planifWrap').innerHTML=html;
}

function doSearch(){
  const q=(document.getElementById('searchQ').value||'').trim().toLowerCase();
  if(!q)return;
  const res=tickets.filter(t=>t.clave.toLowerCase().includes(q)||t.resumen.toLowerCase().includes(q)||t.informador.toLowerCase().includes(q)||t.estado.toLowerCase().includes(q)||t.tipo.toLowerCase().includes(q));
  const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl=txt=>txt.replace(new RegExp('('+esc+')','gi'),'<mark>$1</mark>');
  const div=document.getElementById('searchResults');
  if(!res.length){div.innerHTML=`<p style="color:#64748b;padding:20px 0;">Sin resultados para "${q}".</p>`;return;}
  div.innerHTML=`<p style="font-size:.78rem;color:#64748b;margin-bottom:10px">${res.length} resultado(s)</p>`+
    res.map(t=>`<div class="result-card"><div class="rc-key">${hl(t.clave)} <span class="pill" style="${pillStyle(t.estado)}">${t.estado}</span></div><div class="rc-res">${hl(t.resumen)}</div><div class="rc-meta">👤 ${hl(t.informador)} &nbsp;·&nbsp; 🏷 ${t.tipo} &nbsp;·&nbsp; 📅 ${t.actualizada} &nbsp;·&nbsp; ⚡ ${t.prioridad}</div></div>`).join('');
}

function saveLocalState(){
  try{localStorage.setItem('nb_state',JSON.stringify(tickets.map(t=>({clave:t.clave,horas_min:t.horas_min,horas_asignadas:t.horas_asignadas,ok:t.ok}))));alert('Estado guardado ✅');}catch(e){alert('No se pudo guardar');}
}

function exportCSV(){
  const rows=[['Clave','Tipo','Resumen','Informador','Prioridad','Estado','Actualizada','Hs Min','Hs Asignadas','OK']];
  tickets.forEach(t=>rows.push([t.clave,t.tipo,'"'+t.resumen.replace(/"/g,'""')+'"',t.informador,t.prioridad,t.estado,t.actualizada,t.horas_min,t.horas_asignadas,t.ok?'Si':'No']));
  const csv=rows.map(r=>r.join(';')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='norden-soporte.csv';a.click();
}

function loadFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const lines=text.trim().split(/\r?\n/);
    const sep=lines[0].includes(';')?';':',';
    const headers=lines[0].split(sep).map(h=>h.replace(/^\uFEFF/,'').replace(/^"|"$/g,'').trim());
    const claveCol=headers.find(c=>c.toLowerCase().includes('clave'));
    const infoCol=headers.find(c=>c.toLowerCase().includes('informador')&&!c.toLowerCase().includes('id'));
    const actCol=headers.find(c=>c.toLowerCase().includes('actualizada')||c.toLowerCase().includes('updated'));
    const rows=[];
    for(let i=1;i<lines.length;i++){
      if(!lines[i].trim())continue;
      const parts=[];let iq=false,cur='';
      for(const ch of lines[i]){if(ch==='"')iq=!iq;else if(ch===sep&&!iq){parts.push(cur.trim());cur='';}else cur+=ch;}
      parts.push(cur.trim());
      const row={};headers.forEach((h,j)=>row[h]=parts[j]||'');
      const tipo=row['Tipo de Incidencia']||'';
      if(!tipo)continue;
      rows.push({tipo,clave:row[claveCol]||'',resumen:(row['Resumen']||'').trim(),informador:row[infoCol]||'',prioridad:row['Prioridad']||'',estado:row['Estado']||'',actualizada:row[actCol]||'',horas_min:10,horas_asignadas:0,ok:false});
    }
    if(rows.length){tickets=rows;buildResumen();renderPlanif();updateHrsBar();document.getElementById('dropZone').style.borderColor='#22c55e';document.getElementById('totalBadge').textContent=rows.length+' tickets';}
    else alert('No se encontraron datos válidos.');
  };
  reader.readAsText(file,'UTF-8');
}

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='#4BBFEA';});
dz.addEventListener('dragleave',()=>{dz.style.borderColor='#94a3b8';});
dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='#94a3b8';const f=e.dataTransfer.files[0];if(f)loadFile(f);});

buildResumen();
renderPlanif();
updateHrsBar();
</script>
